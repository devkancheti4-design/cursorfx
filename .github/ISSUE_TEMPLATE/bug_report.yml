name: "🐛 Bug report"
description: Something renders wrong, throws, or sounds off.
labels: ["bug"]
body:
  - type: input
    id: combo
    attributes:
      label: Cursor / trail / click combination
      placeholder: "f1car + sparkles + animals"
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: "Chrome 130 on macOS 15"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
